# Cloudflare Worker — proxy de Meshy AI
#
# Despliegue:
#   1. npm i -g wrangler          (o npx wrangler ...)
#   2. cd worker
#   3. npx wrangler secret put MESHY_API_KEY   # pega aquí tu key msy_...
#   4. npx wrangler deploy
#
# Tras desplegar, wrangler te da una URL tipo:
#   https://meshy-proxy.<tu-subdominio>.workers.dev
# Esa URL es la que va en VITE_MESHY_PROXY_URL del frontend.

name = "meshy-proxy"
main = "meshy-proxy.js"
compatibility_date = "2024-11-01"

[vars]
# Restringe el CORS a tu dominio de GitHub Pages en producción.
# Déjalo en "*" solo para pruebas.
ALLOWED_ORIGIN = "https://cacereslucianoljc5-cmyk.github.io"

# MESHY_API_KEY NO se define aquí: se guarda como secret con
#   npx wrangler secret put MESHY_API_KEY
