name: Deploy to Fly.io

# Runs on every push to the default branch. Requires a repository secret
# named FLY_API_TOKEN (create it with:  fly tokens create deploy -x 999999h).
on:
  push:
    branches:
      - claude/web-page-github-376yuj
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group  # ensure only one deploy runs at a time
    steps:
      - uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
