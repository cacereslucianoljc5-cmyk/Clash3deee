name: Deploy to Fly.io

# Despliega en Fly.io en cada push a las ramas del sitio.
# Requiere el secret FLY_API_TOKEN en el repositorio
# (Settings → Secrets and variables → Actions → New repository secret).
# Genera el token con:  flyctl tokens create deploy -x 999999h
on:
  push:
    branches:
      - claude/web-page-github-376yuj
      - claude/conecta-flyio-github-nwqc2y
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
