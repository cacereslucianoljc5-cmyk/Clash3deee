name: Deploy to Fly.io

# Runs on every push to the default branch. Requires a repository secret
# named FLY_API_TOKEN (create it with:  fly tokens create deploy -x 999999h).
on:
  push:
    branches:
      - claude/web-page-github-376yuj
  workflow_dispatch:

env:
  FLY_APP_NAME: clash3deee

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group  # ensure only one deploy runs at a time
    steps:
      - uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Create the app on first run. Harmless (|| true) once it exists.
      # Requires the token to have permission to create apps in the org.
      - name: Ensure app exists
        run: flyctl apps create "$FLY_APP_NAME" --org personal || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
