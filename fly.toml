# Configuración de la app en Fly.io
# Cambia "app" por el nombre real de tu app en https://fly.io/dashboard
app = "clash3deee"
primary_region = "gru"  # São Paulo — región más cercana; ajústala si prefieres otra

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
